name: lean

on:
  # Build only on pushes to main (e.g. merges); feature-branch work is covered by
  # the pull_request trigger below. This avoids the push+pull_request double-run that
  # billed every PR commit twice, and skips builds for pre-PR lane pushes.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Documentation-only changes don't need the heavy Lean build / axiom pins.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pinned toolchain (lean-toolchain), runs `lake exe cache get`
      # for mathlib, then `lake build`.
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Guardrail — no unmarked sorry
        run: bash scripts/check-no-sorry.sh

      - name: Guardrail — no undeclared axiom/opaque/unsafe
        run: bash scripts/check-no-axiom.sh

      - name: Guardrail — no overclaiming theorem names
        run: bash scripts/check-theorem-names.sh

      - name: Guardrail — axiom-leak gate, static pre-filter (Core direct imports)
        run: bash scripts/check-axioms.sh

      - name: Guardrail — axiom live pin (#print axioms exact match on capstones + Core)
        # Runs lake env lean scripts/print_axioms.lean and asserts:
        #   exists_lerayHopf_torus3_axiomatic = exactly 4 project axioms + 3 kernel, no sorryAx
        #   exists_lerayHopf_r3_axiomatic     = exactly 5 project axioms + 3 kernel, no sorryAx
        #   lower_bound_from_inverse_square_lifespan = kernel axioms only, no project, no sorryAx
        #   localCompactness_R3_of_ballCompact       = kernel axioms only, no project, no sorryAx
        # Catches transitive leaks that the static pre-filter cannot.
        run: bash scripts/check-axioms-live.sh
