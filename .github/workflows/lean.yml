name: lean

# Auto full builds are ABOLISHED (GitHub Actions cost). PRs run only the fast textual
# guards; the full Lean build + axiom pins run MANUALLY via workflow_dispatch. The
# mandatory build gate is the LOCAL incremental build, enforced by the
# scripts/hooks/pre-push git hook (see docs/build-and-checks.md).
on:
  pull_request:
    # `paths-ignore` cannot express mixed include/exclude (GitHub Actions docs: use
    # `paths` with `!` for that). Positive `paths` list instead, evaluated in order
    # with last-match-wins: everything triggers by default, docs/**/*.md is excluded,
    # then docs/statement-cards/** is explicitly re-included — check-statement-cards.sh's
    # guard (b) (issue #158) enforces that ledger, so a PR that only deletes/renames a
    # card must still trigger the guards job.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/statement-cards/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast PR gate — textual guards only, NO Lean build (local build is the mandatory gate).
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guardrail — no unmarked sorry
        run: bash scripts/check-no-sorry.sh
      - name: Guardrail — no undeclared axiom/opaque/unsafe
        run: bash scripts/check-no-axiom.sh
      - name: Guardrail — no overclaiming theorem names
        run: bash scripts/check-theorem-names.sh
      - name: Guardrail — axiom-leak static pre-filter
        run: bash scripts/check-axioms.sh
      - name: Guardrail — release-cone sorry/axiom-free, no placeholder namespaces (issues #147, #151)
        run: bash scripts/check-release-cone.sh
      - name: Guardrail — release-cone regression tests (issue #151)
        run: bash scripts/test-check-release-cone.sh
      - name: Guardrail — statement cards (issue #158)
        run: bash scripts/check-statement-cards.sh

  # Full build + axiom pins — MANUAL ONLY (workflow_dispatch).
  full-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      # `scripts/print_axioms.lean` imports `LerayHopf.Experimental` (for the non-gated
      # Experimental axiom-profile section), but `Experimental` is deliberately NOT in the
      # default target cone — `defaultTargets = ["LerayHopf"]` and `LerayHopf.lean` does not
      # import it, that being the point of the opt-in. So `lake build` above does not produce
      # `LerayHopf/Experimental.olean`, and `check-axioms-live.sh` then dies on
      # "object file ... does not exist" (issue #232). `release-attestation.yml` has carried
      # this step since #185; this job never did. Keep the two workflows in step.
      - name: Build Experimental opt-in module (required by check-axioms-live)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build LerayHopf.Experimental
      - name: Guardrail — no unmarked sorry
        run: bash scripts/check-no-sorry.sh
      - name: Guardrail — no undeclared axiom/opaque/unsafe
        run: bash scripts/check-no-axiom.sh
      - name: Guardrail — no overclaiming theorem names
        run: bash scripts/check-theorem-names.sh
      - name: Guardrail — axiom-leak static pre-filter
        run: bash scripts/check-axioms.sh
      - name: Guardrail — release-cone sorry/axiom-free, no placeholder namespaces (issues #147, #151)
        run: bash scripts/check-release-cone.sh
      - name: Guardrail — release-cone regression tests (issue #151)
        run: bash scripts/test-check-release-cone.sh
      - name: Guardrail — statement cards (issue #158)
        run: bash scripts/check-statement-cards.sh
      - name: Guardrail — axiom live pin
        run: bash scripts/check-axioms-live.sh
      - name: Guardrail — scratch-evidence pin gate (issue #195 §10.5)
        run: bash scripts/check-scratch-pins.sh
