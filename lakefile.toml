name = "lerayHopf"
defaultTargets = ["LerayHopf"]

# Mathematical scope lives in docs/; theorems are added in later PRs.
# This package is currently a scaffold and declares no mathematical content.

# The resolved commit is pinned in lake-manifest.json (the reproducibility source of truth).
# Bumping it via `lake update` is an explicit lean-coder task; do not run it as a side effect.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master"

[[lean_lib]]
name = "LerayHopf"

# S0 spike (uda-lab/lean-pde-notes#2): metadata extractor over the already-built
# LerayHopf oleans. Compiles against Lean core only (ExtractNotes.lean imports `Lean`
# but NOT `LerayHopf`), so `lake build extract_notes` must not rebuild the library.
[[lean_exe]]
name = "extract_notes"
root = "ExtractNotes"
# loadExts := true runs imported env-extension initializers through the interpreter,
# so the exe must link the interpreter symbols.
supportInterpreter = true
