name = "lerayHopf"
version = "0.1.0"
description = "Lean 4 formalization of Leray-Hopf weak-solution existence for the incompressible Navier-Stokes equations on the periodic 3-torus and on R^3, via the Galerkin method. Two capstone theorems are proved kernel-only (no project axioms, no sorryAx); see README.md for the exact modeling scope and claims table."
keywords = ["math", "pde", "navier-stokes", "leray-hopf", "formalization", "galerkin"]
license = "Apache-2.0"
readmeFile = "README.md"
reservoir = true
defaultTargets = ["LerayHopf"]

# The resolved commit is pinned in lake-manifest.json (the reproducibility source of truth).
# Bumping it via `lake update` is an explicit lean-coder task; do not run it as a side effect.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "master"

[[lean_lib]]
name = "LerayHopf"

# S0 spike (uda-lab/leray-hopf-notes#2): metadata extractor over the already-built
# LerayHopf oleans. Compiles against Lean core only (ExtractNotes.lean imports `Lean`
# but NOT `LerayHopf`), so `lake build extract_notes` must not rebuild the library.
[[lean_exe]]
name = "extract_notes"
root = "ExtractNotes"
# loadExts := true runs imported env-extension initializers through the interpreter,
# so the exe must link the interpreter symbols.
supportInterpreter = true
